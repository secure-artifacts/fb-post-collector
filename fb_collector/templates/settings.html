{% extends "base.html" %}
{% block content %}
<section class="card shadow-sm mb-4">
  <div class="card-body">
    <h1 class="h3 mb-3">授权设置</h1>
    <div class="d-flex gap-3 align-items-center justify-content-between flex-wrap">
      <div>
        <h2 class="h5 mb-2">Google Sheets</h2>
        <p class="text-secondary small mb-0">
          状态：{{ "已授权" if google_auth.authorized else "未授权" }}
          {% if not google_auth.credentials_file_exists %}
            。缺少应用 OAuth 配置文件：<span class="mono">{{ google_auth.credentials_file }}</span>
          {% endif %}
        </p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <form action="{{ url_for('google_login') }}" method="post" class="inline">
          <button class="btn btn-primary btn-sm" type="submit">登录 Google 账号</button>
        </form>
        <form action="{{ url_for('google_logout') }}" method="post" class="inline">
          <button type="submit" class="btn btn-danger btn-sm">删除 Google 授权</button>
        </form>
      </div>
    </div>
  </div>
</section>

<section class="card shadow-sm">
  <div class="card-body">
    <h2 class="h5 mb-3">Gyazo</h2>
    <form method="post" class="row g-3 align-items-end">
      <label class="col-md-6 form-label">
        当前 Gyazo Access Token
        <input class="form-control form-control-sm mt-1" name="gyazo_access_token" value="{{ gyazo_access_token }}" placeholder="用户自己的 Token，留空则使用默认 Token">
      </label>
      <div class="col-12">
        <button class="btn btn-primary btn-sm" type="submit">保存</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
