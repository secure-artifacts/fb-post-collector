name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm FBPostCollector.spec

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FBPostCollector -DestinationPath "FBPostCollector-${{ github.ref_name }}-windows.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "FBPostCollector-*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FBPostCollector-*.zip
          generate_release_notes: true
